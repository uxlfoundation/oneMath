name: Documentation
permissions: read-all

# Trigger for PR or merge to develop branch
on:
  push:
    branches: develop
    paths:
      - 'docs/**'
  pull_request:
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install Dependencies
      run: pip install -r docs/requirements.txt
    - name: Configure & Build
      run: |
        cmake -DCMAKE_VERBOSE_MAKEFILE=on -B build docs
        cmake --build build
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: docs
        path: build/Documentation/html

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: gh-pages
        path: gh-pages
    - name: Remove old site
      run: rm -rf gh-pages/*
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: docs
        path: gh-pages
    - name: Push to GitHub Pages
      run: |
        cd gh-pages
        touch .nojekyll
        git add .
        git config --global user.name "GitHub Actions"
        git config --global user.email github-actions@github.com
        git commit -m "Update documentation"
        git push --force origin gh-pages
